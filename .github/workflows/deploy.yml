name: Build and publish

# Pull requests: build and check only.
# main: build, check, then publish the static pages (dist/client/) to the gh-pages branch.
# Cloudflare (Workers Builds, connected to this repo) builds and publishes the full site, with order tracking, by itself.
# The gh-pages copy keeps arafatbin.com working until the domain points to Cloudflare; then this publish step can go.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build also checks every JSON file against schemas/ (ajv)
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      # HTML errors (html-validate) and broken internal links (linkinator)
      - run: npm test
      # Replace the gh-pages branch with the freshly built site (one commit, no old history)
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: dist/client
        run: |
          rm -f wrangler.json .assetsignore
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

