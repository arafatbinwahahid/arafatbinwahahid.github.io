name: Build and publish

# Pull requests: build and check only.
# main: build, check, then publish dist/ to the gh-pages branch.
# GitHub Pages serves the gh-pages branch (Settings -> Pages -> Deploy from a branch -> gh-pages / root),
# so there is only one thing publishing the site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build also checks every JSON file against schemas/ (ajv)
      - run: node build.js
      # HTML errors (html-validate) and broken internal links (linkinator)
      - run: npm test
      # Replace the gh-pages branch with the freshly built site (one commit, no old history)
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

