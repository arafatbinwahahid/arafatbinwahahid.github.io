                          "value_type": "float",
                          "min": 0,
                          "max": 50,
                          "step": 0.01,
                          "hint": "If PayPal converts USD to OMR when you withdraw to your bank. 0 = no conversion."
                        }
                      ],
                      "collapsed": "auto",
                      "hint": "Only for PayPal. All 0 = no fee is added. The buyer pays price + fee, so after PayPal takes its fees you get the full USD price."
                    },
                    {
                      "name": "details",
                      "label": "Payment details",
                      "widget": "list",
                      "required": false,
                      "fields": [
                        {
                          "name": "label",
                          "label": "Label",
                          "widget": "string",
                          "required": true
                        },
                        {
                          "name": "value",
                          "label": "Value",
                          "widget": "string",
                          "required": false,
                          "hint": "Empty = hidden, customers are told to ask on WhatsApp."
                        }
                      ],
                      "collapsed": "auto",
                      "summary": "{{label}}: {{value}}"
                    },
                    {
                      "name": "link",
                      "label": "Pay button",
                      "widget": "object",
                      "required": false,
                      "fields": [
                        {
                          "name": "label",
                          "label": "Text",
                          "widget": "string",
                          "required": false
                        },
                        {
                          "name": "href",
                          "label": "Link",
                          "widget": "string",
                          "required": false,
                          "hint": "A page on this site like /shop/, or a full link like https://…, mailto:… or tel:…",
                          "pattern": [
                            "^$|^(/|https?://|mailto:|tel:|#)",
                            "Start with /, https://, mailto:, tel: or #"
                          ]
                        }
                      ],
                      "collapsed": "auto",
                      "summary": "{{label}}"
                    },
                    {
                      "name": "poster",
                      "label": "Poster / QR code",
                      "widget": "object",
                      "required": false,
                      "fields": [
                        {
                          "name": "src",
                          "label": "Image",
                          "widget": "image",
                          "required": false,
                          "media_folder": "/assets/images/payments",
                          "public_folder": "/assets/images/payments",
                          "hint": "📐 Best size: 1000 × 1000 px (square). For a QR code: square, at least 600 px, with a white border around the code. Upload JPG, PNG or WebP; it is resized and turned into small WebP copies automatically."
                        },
                        {
                          "name": "alt",
                          "label": "Alt text",
                          "widget": "string",
                          "required": false,
                          "hint": "Describe the image for Google and screen readers, e.g. \"Netflix shared account poster\"."
                        }
                      ],
                      "collapsed": "auto",
                      "summary": "{{alt}}"
                    },
                    {
                      "name": "location",
                      "label": "Meeting place (appointments)",
                      "widget": "object",
                      "required": false,
                      "fields": [
                        {
                          "name": "name",
                          "label": "Name",
                          "widget": "string",
                          "required": false
                        },
                        {
                          "name": "address",
                          "label": "Address",
                          "widget": "string",
                          "required": false
                        },
                        {
                          "name": "mapQuery",
                          "label": "Map location",
                          "widget": "string",
                          "required": false,
                          "hint": "Coordinates like 16.81,53.47 or a place name"
                        }
                      ],
                      "collapsed": "auto"
                    },
                    {
                      "name": "hours",
                      "label": "Opening hours",
                      "widget": "list",
                      "required": false,
                      "fields": [
                        {
                          "name": "days",
                          "label": "Days",
                          "widget": "string",
                          "required": true
                        },
                        {
                          "name": "time",
                          "label": "Time",
                          "widget": "string",
                          "required": true
                        }
                      ],
                      "collapsed": "auto",
                      "summary": "{{days}} {{time}}"
                    },
                    {
                      "name": "timeRange",
                      "label": "Allowed appointment times",
                      "widget": "object",
                      "required": false,
                      "fields": [
                        {
                          "name": "start",
                          "label": "From",
                          "widget": "datetime",
                          "required": false,
                          "type": "time",
                          "format": "HH:mm"
                        },
                        {
                          "name": "end",
                          "label": "To",
                          "widget": "datetime",
                          "required": false,
                          "type": "time",
                          "format": "HH:mm"
                        }
                      ],
                      "collapsed": "auto"
                    },
                    {
                      "name": "steps",
                      "label": "How to pay (steps)",
                      "widget": "list",
                      "required": false,
                      "field": {
                        "name": "item",
                        "label": "Item",
                        "widget": "string"
                      }
                    }
                  ],
                  "collapsed": "auto",
                  "summary": "{{name}}"
                }
              ],
              "collapsed": true,
              "summary": "{{code}} – {{name}}",
              "min": 1
            }
          ],
          "file": "data/global/payments.json",
          "format": "json"
        },
        {
          "name": "rates",
          "label": "Exchange rates",
          "icon": "currency_exchange",
          "fields": [
            {
              "name": "_help",
              "widget": "hidden"
            },
            {
              "name": "updated",
              "label": "Rates updated on",
              "widget": "datetime",
              "required": true,
              "type": "date",
              "format": "YYYY-MM-DD",
              "hint": "Shown under the tools. Change it every time you update the rates."
            },
            {
              "name": "note",
              "label": "Note under the tools",
              "widget": "text",
              "required": false
            },
            {
              "name": "currencies",
              "label": "Currencies",
              "widget": "list",
              "required": true,
              "fields": [
                {
                  "name": "code",
                  "label": "Code",
                  "widget": "string",
                  "required": true,
                  "pattern": [
                    "^[A-Z]{3}$",
                    "Three capital letters, e.g. OMR"
                  ],
                  "hint": "e.g. BDT"
                },
                {
                  "name": "name",
                  "label": "Name",
                  "widget": "string",
                  "required": true
                },
                {
                  "name": "rate",
                  "label": "Rate: 1 USD =",
                  "widget": "number",
                  "required": true,
                  "value_type": "float",
                  "min": 0.000001,
                  "step": 0.0001,
                  "hint": "How much of this currency 1 US Dollar buys, above 0. USD itself must stay 1."
                },
                {
                  "name": "decimals",
                  "label": "Decimals",
                  "widget": "number",
                  "required": false,
                  "value_type": "int",
                  "min": 0,
                  "max": 3,
                  "default": 2,
                  "hint": "OMR and BHD use 3"
                },
                {
                  "name": "unit",
                  "label": "Name in words (one)",
                  "widget": "string",
                  "required": false,
                  "hint": "e.g. Rial Omani"
                },
                {
                  "name": "units",
                  "label": "Name in words (many)",
                  "widget": "string",
                  "required": false,
                  "hint": "e.g. Rials Omani"
                },
                {
                  "name": "subunit",
                  "label": "Small unit (one)",
                  "widget": "string",
                  "required": false,
                  "hint": "e.g. Baisa"
                },
                {
                  "name": "subunits",
                  "label": "Small unit (many)",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "subunitPer",
                  "label": "Small units in one",
                  "widget": "number",
                  "required": false,
                  "value_type": "int",
                  "min": 1,
                  "hint": "e.g. 1000 Baisa in 1 Rial"
                },
                {
                  "name": "lakh",
                  "label": "Use lakh and crore",
                  "widget": "boolean",
                  "required": false,
                  "hint": "For Taka: 1,00,000 and \"one lakh\""
                }
              ],
              "collapsed": "auto",
              "summary": "{{code}} – {{name}} ({{rate}})",
              "min": 1,
              "hint": "Used by the currency converter and the website cost calculator. Each code once, USD always with rate 1. These are not the shop prices (those are in Payment methods)."
            }
          ],
          "file": "data/global/rates.json",
          "format": "json"
        },
        {
          "name": "sitemap",
          "label": "Sitemap",
          "icon": "account_tree",
          "fields": [
            {
              "name": "_help",
              "widget": "hidden"
            },
            {
              "name": "urls",
              "label": "Links listed first in sitemap.xml",
              "widget": "list",
              "required": true,
              "field": {
                "name": "item",
                "label": "Item",
                "widget": "string",
                "pattern": [
                  "^https://",
                  "A full link starting with https://"
                ]
              },
              "hint": "Every page is added automatically. Add extra links here, like the CV PDF."
            },
            {
              "name": "redirects",
              "label": "Moved pages",
              "widget": "list",
              "required": false,
              "fields": [
                {
                  "name": "from",
                  "label": "Old address",
                  "widget": "string",
                  "required": true,
                  "hint": "e.g. /shop/old-product/",
                  "pattern": [
                    "^/",
                    "This is not in the right format"
                  ]
                },
                {
                  "name": "to",
                  "label": "New address",
                  "widget": "string",
                  "required": true,
                  "hint": "e.g. /shop/new-product/",
                  "pattern": [
                    "^(/|https://)",
                    "Start with / or https://"
                  ]
                }
              ],
              "collapsed": "auto",
              "summary": "{{from}} → {{to}}",
              "hint": "Visitors and Google opening an old address go to the new one (after a slug change or a removed page)."
            }
          ],
          "file": "data/global/sitemap.json",
          "format": "json"
        },
        {
          "name": "icons",
          "label": "Icons",
          "icon": "interests",
          "fields": [
            {
              "name": "icons",
              "label": "Icons",
              "widget": "keyvalue",
              "required": false,
              "root": true,
              "key_label": "Name",
              "value_label": "SVG code (inside a 24×24 stroke icon)",
              "hint": "Add your own: paste the inner SVG code, e.g. <path d=\"…\"/>. The name can then be chosen in every Icon field."
            }
          ],
          "file": "data/global/icons.json",
          "format": "json"
        }
      ]
    }
  ]
}
