{
  "backend": {
    "name": "github",
    "repo": "arafatbinwahahid/arafatbinwahahid.github.io",
    "branch": "cms-drafts",
    "auth_methods": [
      "token"
    ],
    "commit_messages": {
      "create": "Create {{collection}} “{{slug}}”",
      "update": "Update {{collection}} “{{slug}}”",
      "delete": "Delete {{collection}} “{{slug}}”",
      "uploadMedia": "Upload “{{path}}”",
      "deleteMedia": "Delete “{{path}}”"
    }
  },
  "app_title": "Arafat Bin Wahahid CMS",
  "logo": {
    "src": "/assets/opt/arafatbin-icon-180.56419605.png"
  },
  "site_url": "https://arafatbin.com",
  "display_url": "arafatbin.com",
  "media_folder": "assets/images",
  "public_folder": "/assets/images",
  "media_libraries": {
    "default": {
      "config": {
        "slugify_filename": true,
        "max_file_size": 15000000,
        "transformations": {
          "raster_image": {
            "format": "webp",
            "quality": 85,
            "width": 2000,
            "height": 2000
          }
        }
      }
    }
  },
  "slug": {
    "encoding": "ascii",
    "clean_accents": true
  },
  "output": {
    "omit_empty_optional_fields": false,
    "json": {
      "indent_size": 2
    }
  },
  "editor": {
    "preview": false
  },
  "show_preview_links": true,
  "collections": [
    {
      "name": "products",
      "label": "Products",
      "label_singular": "product",
      "icon": "shopping_bag",
      "description": "Things people buy in the shop. Prices, stock, plans, images and SEO for each product. Save keeps your changes as a draft. Press \"Publish all\" on arafatbin.com/admin/publish/ to put all drafts on the site at once.",
      "file": "data/collections/products.json",
      "format": "json",
      "identifier_field": "title",
      "summary": "{{title}} · {{category}}",
      "thumbnail": "images.0.src",
      "view_filters": [
        {
          "name": "drafts",
          "label": "Drafts",
          "field": "status",
          "pattern": "draft"
        }
      ],
      "view_groups": [
        {
          "label": "Category",
          "field": "category"
        }
      ],
      "preview_path": "shop/{{fields.slug}}/",
      "fields": [
        {
          "name": "title",
          "label": "Product name",
          "widget": "string",
          "required": true
        },
        {
          "name": "slug",
          "label": "URL slug",
          "widget": "string",
          "required": true,
          "pattern": [
            "^[a-z0-9]+(-[a-z0-9]+)*$",
            "Lowercase letters, numbers and dashes"
          ],
          "hint": "Page address: /shop/<slug>/. Changing it breaks old links."
        },
        {
          "name": "id",
          "label": "Product ID",
          "widget": "string",
          "required": true,
          "hint": "Unique, e.g. P006.",
          "pattern": [
            "^[A-Za-z0-9-]+$",
            "Letters, numbers and dashes, no spaces"
          ]
        },
        {
          "name": "status",
          "label": "Status",
          "widget": "select",
          "required": false,
          "options": [
            {
              "label": "Live",
              "value": ""
            },
            {
              "label": "Draft (hidden from the site)",
              "value": "draft"
            }
          ],
          "default": "",
          "hint": "Draft hides it from the site, the sitemap and search."
        },
        {
          "name": "paymentsOff",
          "label": "Payment methods turned off",
          "widget": "select",
          "required": false,
          "multiple": true,
          "options": [
            {
              "label": "Bank Transfer (OMR)",
              "value": "omr-bank"
            },
            {
              "label": "Transfer Money (OMR)",
              "value": "transfer-money"
            },
            {
              "label": "Face to Face (OMR)",
              "value": "face-to-face"
            },
            {
              "label": "PayPal (USD)",
              "value": "usd-paypal"
            },
            {
              "label": "RedotPay (USD)",
              "value": "usd-redotpay"
            },
            {
              "label": "Bank Transfer (BDT)",
              "value": "bdt-bank"
            },
            {
              "label": "Send Money (BDT)",
              "value": "bdt-send-money"
            },
            {
              "label": "Face to Face (BDT)",
              "value": "bdt-face-to-face"
            }
          ],
          "hint": "Pick the methods this product must not be paid with, e.g. PayPal. Empty = every method that is on in Settings → Payment methods. To turn a method off everywhere, use its “Show this method” switch there."
        },
        {
          "name": "category",
          "label": "Category",
          "widget": "string",
          "required": true
        },
        {
          "name": "seo",
          "label": "🔍 SEO",
          "widget": "object",
          "required": false,
          "fields": [
            {
              "name": "title",
              "label": "SEO title",
              "widget": "string",
              "required": false,
              "hint": "Shown in Google and the browser tab. Up to about 60 characters. Empty = the page title.",
              "maxlength": 70
            },
            {
              "name": "titleSuffix",
              "label": "Add \" | Arafat Bin Wahahid\" to the title",
              "widget": "boolean",
              "required": false,
              "default": true,
              "hint": "Added only while the title stays under 60 characters."
            },
            {
              "name": "description",
              "label": "Meta description",
              "widget": "text",
              "required": false,
              "hint": "The grey text under the title in Google. 70–155 characters.",
              "maxlength": 170
            },
            {
              "name": "keywords",
              "label": "Keywords",
              "widget": "list",
              "required": false,
              "field": {
                "name": "item",
                "label": "Item",
                "widget": "string"
              },
              "hint": "Optional. Google ignores this, Bing uses it a little."
            },
            {
              "name": "canonical",
              "label": "Canonical URL",
              "widget": "string",
              "required": false,
              "hint": "Only when this page copies another URL. Empty = this page.",
              "pattern": [
                "^$|^(/|https://)",
                "Start with / or https://"
              ]
            },
            {
              "name": "image",
              "label": "Share image",
              "widget": "image",
              "required": false,
              "media_folder": "/assets/images/social",
              "public_folder": "/assets/images/social",
              "hint": "Image for Facebook, WhatsApp and X previews. Empty = the main image of the page. 📐 Best size: 1200 × 630 px (1.91:1), JPG or PNG. Shown when the page is shared on Facebook, WhatsApp, X or LinkedIn and in Google Discover. Upload JPG, PNG or WebP; it is resized and turned into small WebP copies automatically."
            },
            {
              "name": "imageAlt",
              "label": "Share image alt text",
              "widget": "string",
              "required": false
            },
            {
              "name": "author",
              "label": "Author",
              "widget": "string",
              "required": false,
              "hint": "Empty = Settings → Site → SEO defaults → Author."
            },
            {
              "name": "robots",
              "label": "Search engine rules (robots)",
              "widget": "object",
              "required": false,
              "fields": [
                {
                  "name": "index",
                  "label": "Show in Google (index)",
                  "widget": "boolean",
                  "required": false,
                  "default": true,
                  "hint": "Off = noindex, and the page is left out of sitemap.xml."
                },
                {
                  "name": "follow",
                  "label": "Follow links on this page",
                  "widget": "boolean",
                  "required": false,
                  "default": true
                },
                {
                  "name": "nosnippet",
                  "label": "No text snippet in results",
                  "widget": "boolean",
                  "required": false
                },
                {
                  "name": "noimageindex",
                  "label": "Do not index images",
                  "widget": "boolean",
                  "required": false
                },
                {
                  "name": "notranslate",
                  "label": "No translate offer in Google",
                  "widget": "boolean",
                  "required": false
                },
                {
                  "name": "indexifembedded",
                  "label": "Index when embedded",
                  "widget": "boolean",
                  "required": false
                },
                {
                  "name": "maxSnippet",
                  "label": "Max snippet length",
                  "widget": "number",
                  "required": false,
                  "value_type": "int",
                  "default": -1,
                  "min": -1,
                  "hint": "-1 = no limit"
                },
                {
                  "name": "maxImagePreview",
                  "label": "Max image preview",
                  "widget": "select",
                  "required": false,
                  "options": [
                    "",
                    "none",
                    "standard",
                    "large"
                  ],
                  "default": "large"
                },
                {
                  "name": "maxVideoPreview",
                  "label": "Max video preview (seconds)",
                  "widget": "number",
                  "required": false,
                  "value_type": "int",
                  "default": -1,
                  "min": -1,
                  "hint": "-1 = no limit"
                },
                {
                  "name": "unavailableAfter",
                  "label": "Remove from Google after",
                  "widget": "datetime",
                  "required": false,
                  "type": "date",
                  "format": "YYYY-MM-DD",
                  "hint": "Optional end date for offers that expire."
                }
              ],
              "collapsed": "auto"
            },
            {
              "name": "googlebot",
              "label": "Extra rules for Google only",
              "widget": "string",
              "required": false,
              "hint": "e.g. nosnippet"
            },
            {
              "name": "bingbot",
              "label": "Extra rules for Bing only",
              "widget": "string",
              "required": false
            },
            {
              "name": "openGraph",
              "label": "Facebook / WhatsApp (Open Graph)",
              "widget": "object",
              "required": false,
              "fields": [
                {
                  "name": "type",
                  "label": "Type",
                  "widget": "string",
                  "required": false,
                  "hint": "website, article, product, profile … Empty = automatic."
                },
                {
                  "name": "title",
                  "label": "Title",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "description",
                  "label": "Description",
                  "widget": "text",
                  "required": false
                },
                {
                  "name": "localeAlternate",
                  "label": "Other locales",
                  "widget": "list",
                  "required": false,
                  "field": {
                    "name": "item",
                    "label": "Item",
                    "widget": "string",
                    "pattern": [
                      "^[a-z]{2}_[A-Z]{2}$",
                      "This is not in the right format"
                    ]
                  },
                  "hint": "e.g. bn_BD"
                }
              ],
              "collapsed": "auto"
            },
            {
              "name": "twitter",
              "label": "X (Twitter) card",
              "widget": "object",
              "required": false,
              "fields": [
                {
                  "name": "card",
                  "label": "Card type",
                  "widget": "select",
                  "required": false,
                  "options": [
                    "",
                    "summary",
                    "summary_large_image"
                  ]
                },
                {
                  "name": "title",
                  "label": "Title",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "description",
                  "label": "Description",
                  "widget": "text",
                  "required": false
                },
                {
                  "name": "creator",
                  "label": "Creator @username",
                  "widget": "string",
                  "required": false
                }
              ],
              "collapsed": "auto"
            },
            {
              "name": "alternates",
              "label": "Other language versions (hreflang)",
              "widget": "list",
              "required": false,
              "fields": [
                {
                  "name": "hreflang",
                  "label": "Language code",
                  "widget": "string",
                  "required": true,
                  "hint": "e.g. bn, ar, en"
                },
                {
                  "name": "href",
                  "label": "URL",
                  "widget": "string",
                  "required": true,
                  "pattern": [
                    "^(/|https://)",
                    "Start with / or https://"
                  ]
                }
              ],
              "collapsed": "auto",
              "summary": "{{hreflang}}: {{href}}"
            },
            {
              "name": "schema",
              "label": "Extra structured data (JSON-LD)",
              "widget": "list",
              "required": false,
              "field": {
                "name": "item",
                "label": "JSON-LD object",
                "widget": "code",
                "default_language": "json",
                "output_code_only": true,
                "allow_language_selection": false
              },
              "hint": "Paste schema.org JSON. Added next to the automatic data."
            },
            {
              "name": "meta",
              "label": "Other meta tags",
              "widget": "list",
              "required": false,
              "fields": [
                {
                  "name": "name",
                  "label": "name",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "property",
                  "label": "property (instead of name)",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "content",
                  "label": "content",
                  "widget": "string",
                  "required": true
                }
              ],
              "collapsed": "auto",
              "summary": "{{name}}{{property}}"
            }
          ],
          "collapsed": true,
          "hint": "Leave a field empty and the site fills it in automatically."
        },
        {
          "name": "variants",
          "label": "Plans",
          "widget": "list",
          "required": false,
          "fields": [
            {
              "name": "id",
              "label": "Plan ID",
              "widget": "string",
              "required": true,
              "hint": "Unique, e.g. P005-STD-1M. Never reuse an old ID.",
              "pattern": [
                "^[A-Za-z0-9-]+$",
                "Letters, numbers and dashes, no spaces"
              ]
            },
            {
              "name": "name",
              "label": "Plan name",
              "widget": "string",
              "required": true
            },
            {
              "name": "prices",
              "label": "Price",
              "widget": "object",
              "required": true,
              "fields": [
                {
                  "name": "OMR",
                  "label": "OMR",
                  "widget": "number",
                  "required": false,
                  "value_type": "float",
                  "min": 0,
                  "step": 0.001
                },
                {
                  "name": "USD",
                  "label": "USD",
                  "widget": "number",
                  "required": false,
                  "value_type": "float",
                  "min": 0,
                  "step": 0.001
                },
                {
                  "name": "BDT",
                  "label": "BDT",
                  "widget": "number",
                  "required": false,
                  "value_type": "float",
                  "min": 0,
                  "step": 0.001
                }
              ],
              "collapsed": false,
              "hint": "USD is the main price. A currency with a rate (Settings → Payment methods) is worked out from USD; fill it here only if it has no rate."
            },
            {
              "name": "compareAtPrices",
              "label": "Old price (shown crossed out)",
              "widget": "object",
              "required": false,
              "fields": [
                {
                  "name": "OMR",
                  "label": "OMR",
                  "widget": "number",
                  "required": false,
                  "value_type": "float",
                  "min": 0,
                  "step": 0.001
                },
                {
                  "name": "USD",
                  "label": "USD",
                  "widget": "number",
                  "required": false,
                  "value_type": "float",
                  "min": 0,
                  "step": 0.001
                },
                {
                  "name": "BDT",
                  "label": "BDT",
                  "widget": "number",
                  "required": false,
                  "value_type": "float",
                  "min": 0,
                  "step": 0.001
                }
              ],
              "collapsed": false,
              "hint": "Optional, for a sale. Rates apply here too."
            },
            {
              "name": "stock",
              "label": "Stock",
              "widget": "number",
              "required": true,
              "value_type": "int",
              "min": 0,
              "default": 0,
              "hint": "0 = sold out"
            }
          ],
          "collapsed": "auto",
          "summary": "{{name}} ({{stock}} in stock)",
          "hint": "One plan = one price. Add more plans for options like 1 or 3 months.",
          "min": 1
        },
        {
          "name": "images",
          "label": "Images",
          "widget": "list",
          "required": true,
          "fields": [
            {
              "name": "src",
              "label": "Image",
              "widget": "image",
              "required": true,
              "media_folder": "/assets/images/products",
              "public_folder": "/assets/images/products",
              "hint": "📐 Best size: 1200 × 900 px (4:3, landscape). The first image is the shop card (cut to 4:3) and the big picture on the product page; the others show as thumbnails under it. Upload JPG, PNG or WebP; it is resized and turned into small WebP copies automatically."
            },
            {
              "name": "alt",
              "label": "Alt text",
              "widget": "string",
              "required": true,
              "hint": "Needed: describe the image for Google and screen readers, e.g. \"Netflix Profile Lock screen on a phone\"."
            }
          ],
          "collapsed": "auto",
          "summary": "{{alt}}",
          "thumbnail": "src",
          "hint": "The first image is the main one. 📐 Best size: 1200 × 900 px (4:3, landscape). The first image is the shop card (cut to 4:3) and the big picture on the product page; the others show as thumbnails under it. Upload JPG, PNG or WebP; it is resized and turned into small WebP copies automatically.",
          "min": 1
        },
        {
          "name": "summary",
          "label": "Short summary",
          "widget": "text",
          "required": true,
          "hint": "Shown on cards and under the title."
        },
        {
          "name": "about",
          "label": "About",
          "widget": "text",
          "required": true
        },
        {
          "name": "description",
          "label": "Description",
          "widget": "list",
          "required": true,
          "field": {
            "name": "item",
            "label": "Paragraph",
            "widget": "text"
          }
        },
        {
          "name": "usageTitle",
          "label": "Usage heading",
          "widget": "string",
          "required": false
        },
        {
          "name": "usageIntro",
          "label": "Usage intro",
          "widget": "text",
          "required": false
        },
        {
          "name": "usage",
          "label": "Usage steps / rules",
          "widget": "list",
          "required": false,
          "field": {
            "name": "item",
            "label": "Item",
            "widget": "string"
          }
        },
        {
          "name": "features",
          "label": "Features",
          "widget": "list",
          "required": true,
          "fields": [
            {
              "name": "icon",
              "label": "Icon",
              "widget": "select",
              "required": false,
              "options": [
                "wa",
                "phone",
                "mail",
                "globe",
                "pin",
                "linkedin",
                "download",
                "arrow",
                "dots",
                "home",
                "cart",
                "briefcase",
                "user",
                "clock",
                "tool",
                "image",
                "award",
                "star",
                "file",
                "help",
                "shield",
                "refresh",
                "map",
                "pen",
                "chart",
                "table",
                "check",
                "zap",
                "lock",
                "headset",
                "minus",
                "plus",
                "trash",
                "close",
                "bank",
                "wallet",
                "card",
                "calendar",
                "copy",
                "tv",
                "search",
                "calculator",
                "swap",
                "code",
                "box",
                "chat"
              ],
              "hint": "Icons come from Settings → Icons (data/global/icons.json).",
              "dropdown_threshold": 0
            },
            {
              "name": "text",
              "label": "Text",
              "widget": "string",
              "required": true
            }
          ],
          "collapsed": "auto",
          "summary": "{{text}}"
        },
        {
          "name": "format",
          "label": "Format / delivery",
          "widget": "string",
          "required": true,
          "hint": "e.g. Account details by email"
        },
        {
          "name": "faq",
          "label": "Questions and answers",
          "widget": "list",
          "required": false,
          "fields": [
            {
              "name": "q",
              "label": "Question",
              "widget": "string",
              "required": true
            },
            {
              "name": "a",
              "label": "Answer",
              "widget": "text",
              "required": true
            }
          ],
          "collapsed": "auto",
          "summary": "{{q}}",
          "label_singular": "question"
        },
        {
          "name": "reviews",
          "label": "Reviews of this product",
          "widget": "list",
          "required": false,
          "fields": [
            {
              "name": "name",
              "label": "Customer name",
              "widget": "string",
              "required": true
            },
            {
              "name": "role",
              "label": "Role or country",
              "widget": "string",
              "required": false
            },
            {
              "name": "date",
              "label": "Date",
              "widget": "string",
              "required": false,
              "hint": "Free text, e.g. \"March 2026\"."
            },
            {
              "name": "rating",
              "label": "Stars (1–5)",
              "widget": "number",
              "required": false,
              "value_type": "int",
              "min": 1,
              "max": 5,
              "default": 5
            },
            {
              "name": "text",
              "label": "Review",
              "widget": "text",
              "required": true
            },
            {
              "name": "link",
              "label": "Link to the review",
              "widget": "object",
              "required": false,
              "fields": [
                {
                  "name": "label",
                  "label": "Text",
                  "widget": "string",
                  "required": true
                },
                {
                  "name": "href",
                  "label": "Link",
                  "widget": "string",
                  "required": true,
                  "hint": "A page on this site like /shop/, or a full link like https://…, mailto:… or tel:…",
                  "pattern": [
                    "^$|^(/|https?://|mailto:|tel:|#)",
                    "Start with /, https://, mailto:, tel: or #"
                  ]
                }
              ],
              "collapsed": "auto",
              "summary": "{{label}}"
            },
            {
              "name": "avatar",
              "label": "Photo",
              "widget": "image",
              "required": false,
              "media_folder": "/assets/images/reviews",
              "public_folder": "/assets/images/reviews",
              "hint": "📐 Best size: 400 × 400 px (square) photo of the person. Upload JPG, PNG or WebP; it is resized and turned into small WebP copies automatically. Saved for later: the site does not show this yet."
            },
            {
              "name": "source",
              "label": "Where it was posted",
              "widget": "select",
              "required": false,
              "options": [
                "",
                "Fiverr",
                "Google",
                "Facebook",
                "WhatsApp",
                "Website"
              ],
              "hint": "Saved for later: the site does not show this yet."
            },
            {
              "name": "verified",
              "label": "Verified buyer",
              "widget": "boolean",
              "required": false,
              "hint": "Saved for later: the site does not show this yet."
            }
          ],
          "collapsed": "auto",
          "summary": "{{name}}"
        },
        {
          "name": "externalLink",
          "label": "Outside link (e.g. Fiverr)",
          "widget": "object",
          "required": false,
          "fields": [
            {
              "name": "label",
              "label": "Text",
              "widget": "string",
              "required": true
            },
            {
              "name": "href",
              "label": "Link",
              "widget": "string",
              "required": true,
              "hint": "A page on this site like /shop/, or a full link like https://…, mailto:… or tel:…",
              "pattern": [
                "^$|^(/|https?://|mailto:|tel:|#)",
                "Start with /, https://, mailto:, tel: or #"
              ]
            },
            {
